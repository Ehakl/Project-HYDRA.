services:
  mysql_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hydra_auth
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hydra_net

  mongo_db:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - hydra_net

  redis_cache:
    image: redis:alpine
    restart: always
    networks:
      - hydra_net

  auth-service:
    build: ./backend/auth-service
    restart: always
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_URL=redis://redis_cache:6379
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - ALLOW_DEV_VERIFICATION=false
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - mysql_db
      - redis_cache
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - hydra_net

  doc-service:
    build: ./backend/doc-service
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo_db:27017
      - REDIS_URL=redis://redis_cache:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo_db
      - redis_cache
    networks:
      - hydra_net

  search-service:
    build: ./backend/search-service
    restart: always
    networks:
      - hydra_net

  ai-service:
    build: ./ai-service
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo_db:27017
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo_db
    networks:
      - hydra_net

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - hydra_net

networks:
  hydra_net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data: