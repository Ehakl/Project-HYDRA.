server {
    listen 80;
    server_name localhost;

    # 1. Serve the React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This is CRITICAL for React Router. If a user refreshes on /dashboard,
        # Nginx needs to serve index.html, not a 404.
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Node.js Gateway
    location /api {
        proxy_pass http://auth-service:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Proxy WebSocket connections to the Node.js Gateway
    location /ws {
        proxy_pass http://auth-service:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}