<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    input, button { width: 100%; margin-top: 5px; padding: 8px; box-sizing: border-box; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Hydra Snipper</h3>
  <div id="auth-status">Checking auth...</div>
  <input type="text" id="title" placeholder="Snippet Title">
  <textarea id="content" placeholder="Snippet content..." rows="4"></textarea>
  <button id="save-btn">Save to Hydra</button>
  <div id="message"></div>
  <script src="popup.js"></script>
</body>
</html>
